server:
  port: 8080

spring:
  application:
    name: ai-chat-v1

langchain4j:
  open-ai:
    streaming-chat-model:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com/v1
      model-name: deepseek-chat
      temperature: 0.7
      log-requests: true
      log-responses: true